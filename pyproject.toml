[tool.poetry]
name = "database-vacancies"
version = "0.1.0"
description = ""
authors = ["Elena Kandrushina <kandrushina.ea@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.5"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.11"


[tool.poetry.group.lint.dependencies]
flake8 = ">=7.3.0,<8.0.0"
mypy = ">=1.18.2,<2.0.0"
black = ">=25.9.0,<26.0.0"
isort = ">=7.0.0,<8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
types-psycopg2 = "^2.9.21.20251012"
types-requests = "^2.32.4.20250913"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = "/(.git|venv)/"


[tool.isort]
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'